<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>全聯會理監事名錄</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: left rail of 屆次 (stacks to a chip row on phones) + main register; a person drawer traces one name across terms */
:root{
  --bg:#f4f5f1; --panel:#ffffff; --ink:#1d2622; --muted:#5d6a64; --line:#d9ddd5;
  --jade:#2e6b5a; --jade-soft:#e2eee8; --seal:#a53b2b; --seal-soft:#f6e3df; --ochre:#8a6a1f; --ochre-soft:#f3ebd5;
  --slate:#4b5d7a; --slate-soft:#e3e8f1; --pend:#9aa39e;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --panel:#1b221f; --ink:#e6ebe7; --muted:#9aa8a1; --line:#2d3833;
  --jade:#7cc1a9; --jade-soft:#1f3a31; --seal:#ec8b79; --seal-soft:#43231d; --ochre:#d8b765; --ochre-soft:#3a3120;
  --slate:#a3b5d6; --slate-soft:#262f40; --pend:#6c7771; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --panel:#1b221f; --ink:#e6ebe7; --muted:#9aa8a1; --line:#2d3833;
  --jade:#7cc1a9; --jade-soft:#1f3a31; --seal:#ec8b79; --seal-soft:#43231d; --ochre:#d8b765; --ochre-soft:#3a3120;
  --slate:#a3b5d6; --slate-soft:#262f40; --pend:#6c7771; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:22px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:14px}
.seal{display:inline-grid;place-items:center;width:46px;height:46px;border:2px solid var(--seal);color:var(--seal);font-family:var(--f-display);font-weight:800;font-size:13px;line-height:1.05;letter-spacing:.05em;border-radius:4px;flex:none}
.titleblock{display:flex;gap:14px;align-items:center;min-width:0}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,3.6vw,32px);margin:0;letter-spacing:.04em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.searchbox{display:flex;gap:8px;align-items:center;flex:1 1 280px;max-width:420px}
.searchbox input{flex:1;min-width:0;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.searchbox input:focus,button:focus-visible,select:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}
nav.terms{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:grid;gap:2px}
nav.terms .grp{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:10px 0 4px;padding-left:10px}
nav.terms button{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:7px 10px;border-radius:6px;font-size:14px}
nav.terms button:hover{background:var(--jade-soft)}
nav.terms button[aria-current="true"]{background:var(--ink);color:var(--bg)}
nav.terms button[aria-current="true"] .pres{color:var(--bg);opacity:.8}
nav.terms .pres{font-size:12px;color:var(--muted)}
nav.terms .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
main{min-width:0;display:grid;gap:18px}
.termhead{display:grid;gap:10px}
.termhead h2{font-family:var(--f-display);font-size:26px;margin:0;letter-spacing:.03em;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:500;white-space:nowrap}
.st-official{background:var(--jade-soft);color:var(--jade)}
.st-partial{background:var(--ochre-soft);color:var(--ochre)}
.st-pend{background:var(--seal-soft);color:var(--seal)}
.note{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14px;max-width:78ch}
.summary{display:grid;gap:8px}
.bar{display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--line)}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend b{color:var(--ink);font-weight:600}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{all:unset;cursor:pointer;font-size:13px;padding:4px 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
thead th{font-size:12px;letter-spacing:.1em;color:var(--muted);font-weight:500;background:var(--bg);position:sticky;top:0}
tr.rolebreak td{border-top:2px solid var(--line)}
td.role{white-space:nowrap;color:var(--muted);font-size:13px}
td.name{white-space:nowrap;font-weight:700}
td.name button{all:unset;cursor:pointer;border-bottom:1px dotted var(--muted)}
td.name button:hover{color:var(--jade);border-color:var(--jade)}
td.edu{min-width:240px}
td.edu div+div{margin-top:2px}
td.note{color:var(--muted);font-size:13px;min-width:200px}
.pend{color:var(--pend)}
.p-中醫系{background:var(--jade-soft);color:var(--jade)}
.p-後中{background:var(--slate-soft);color:var(--slate)}
.p-特考{background:var(--ochre-soft);color:var(--ochre)}
.p-other{background:var(--seal-soft);color:var(--seal)}
.p-pend{background:transparent;color:var(--pend);border:1px dashed var(--line)}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:12px}
.panel h3{font-family:var(--f-display);margin:0;font-size:20px}
.timeline{display:grid;gap:6px}
.tl{display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:12px;align-items:baseline;font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line)}
.tl button{all:unset;cursor:pointer;color:var(--jade)}
.close{all:unset;cursor:pointer;font-size:13px;color:var(--muted);justify-self:start}
.results{display:grid;gap:4px}
.res{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:10px;padding:8px 10px;border-radius:6px;font-size:14px}
.res:hover{background:var(--jade-soft)}
.res .n{font-weight:700}
.res .t{color:var(--muted);font-size:13px}
.pres-table td,.pres-table th{white-space:nowrap}
.sources{font-size:13px;color:var(--muted);display:grid;gap:4px}
.sources a{color:var(--jade);word-break:break-all}
details summary{cursor:pointer;font-weight:600}
td.ck{width:44px;text-align:center;padding-inline:6px}
td.ck input,th.ck input{width:18px;height:18px;accent-color:var(--jade);cursor:pointer;margin:2px 0 0}
th.ck{width:44px;text-align:center;padding-inline:6px}
tr.done td{background:color-mix(in srgb,var(--jade-soft) 50%,var(--panel))}
tr.done td.name button{color:var(--jade)}
.checkbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.checkbar .prog{font-variant-numeric:tabular-nums;font-size:14px;min-width:120px}
.checkbar .prog b{font-size:18px;color:var(--jade)}
.pbar{flex:1 1 160px;height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:120px}
.pbar span{display:block;height:100%;background:var(--jade)}
.act{all:unset;cursor:pointer;font-size:13px;padding:4px 11px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.act:hover{border-color:var(--jade)}
.act.warn{color:var(--seal);border-color:var(--seal)}
.toast{font-size:13px;color:var(--jade)}
nav.terms .ckc{font-size:11.5px;color:var(--jade);font-variant-numeric:tabular-nums;margin-left:4px}
footer{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  nav.terms{position:static;display:flex;overflow-x:auto;gap:6px;padding-bottom:6px}
  nav.terms .grp{display:none}
  nav.terms button{white-space:nowrap;border:1px solid var(--line);grid-template-columns:auto}
  nav.terms .pres{display:none}
}
@media (prefers-reduced-motion:no-preference){nav.terms button,.res,.filters button{transition:background .15s}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="titleblock">
      <span class="seal" aria-hidden="true">全聯<br>名錄</span>
      <div>

  <div class="layout">

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const PRES = Object.fromEntries(D.pres.map(p=>[p[0],p[2]]));
const terms = D.terms.map((t,i)=>{
  const short = t.h.replace(/（.*$/,'');
  const pres = (t.rows.find(r=>r[0]==='理事長')||[])[1]||'';
  return {...t, i, short, id:'t'+i, pres};
});
const statusCls = s => s.startsWith('官方')||s.startsWith('法人') ? 'st-official' : s.startsWith('僅知') ? 'st-pend' : 'st-partial';
const statusColor = s => ({'st-official':'var(--jade)','st-partial':'var(--ochre)','st-pend':'var(--seal)'})[statusCls(s)];
const pathKey = p => !p || p.startsWith('待') ? 'pend' : p.startsWith('中醫系') ? '中醫系' : p==='後中' ? '後中' : p==='特考' ? '特考' : 'other';
const pathLabel = {'中醫系':'中醫系','後中':'學士後中醫','特考':'特考','other':'其他／檢定','pend':'待查'};
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const srcLink = s => esc(s).replace(/〔?([SE]\d+)〕?/g,(m,c)=>`<a href="#src" data-src="${c}" style="color:var(--jade)">${m}</a>`);

const nav = document.getElementById('nav'), main = document.getElementById('main');
let current = 0, filter = 'all', ckfilter = 'all', armed = false;
let CK = {};
try{ CK = JSON.parse(localStorage.getItem('tm_checks')||'{}')||{}; }catch(e){ CK = {}; }
const keyOf = (t,r) => t.i+'|'+r[0]+'|'+r[1];
const saveCK = () => { try{ localStorage.setItem('tm_checks', JSON.stringify(CK)); }catch(e){} };
const doneIn = t => t.rows.filter(r=>CK[keyOf(t,r)]).length;

function renderNav(){
  const groups = [['現行與近屆',t=>/^第十/.test(t.short)],['第二至九屆',t=>/^第[二三四五六七八九]屆/.test(t.short)],['改制前（民國 64–81 年）',t=>/^改制前/.test(t.short)]];
  let html = `<button data-view="pres" aria-current="${current==='pres'}"><span>歷任理事長</span><span class="pres"></span></button>`;
  for (const [g,fn] of groups){
    html += `<div class="grp">${g}</div>`;
    for (const t of terms.filter(fn)) html += `<button data-term="${t.i}" aria-current="${current===t.i}"><span><i class="dot" style="background:${statusColor(t.status)}"></i>${esc(t.short)}</span><span class="pres">${esc(t.pres)}${doneIn(t)?`<span class="ckc">${doneIn(t)}/${t.rows.length}</span>`:''}</span></button>`;
  }
  html += `<div class="grp">附錄</div><button data-view="sources" aria-current="${current==='sources'}"><span>資料來源</span><span class="pres"></span></button>`;
  nav.innerHTML = html;
}

function pathBar(rows){
  const c = {}; rows.forEach(r=>{const k=pathKey(r[3]); c[k]=(c[k]||0)+1});
  const col = {'中醫系':'var(--jade)','後中':'var(--slate)','特考':'var(--ochre)','other':'var(--seal)','pend':'var(--line)'};
  const order = ['中醫系','後中','特考','other','pend'].filter(k=>c[k]);
  return `<div class="summary"><div class="bar" role="img" aria-label="取得途徑分布">${order.map(k=>`<span style="width:${c[k]/rows.length*100}%;background:${col[k]}"></span>`).join('')}</div>
  <div class="legend">${order.map(k=>`<span><i class="sw" style="background:${col[k]};${k==='pend'?'border:1px solid var(--muted)':''}"></i>${pathLabel[k]} <b>${c[k]}</b></span>`).join('')}<span>共 <b>${rows.length}</b> 列</span></div></div>`;
}

function renderTerm(i){
  const t = terms[i];
  const rows = t.rows.filter(r=>(filter==='all'||pathKey(r[3])===filter) && (ckfilter==='all' || (ckfilter==='done') === !!CK[keyOf(t,r)]));
  const done = doneIn(t), total = t.rows.length;
  let prevRole = null;
  const body = rows.map(r=>{
    const brk = prevRole!==null && r[0]!==prevRole && !r[0].startsWith(prevRole); prevRole=r[0];
    const edu = r[2]==='待查' ? '<span class="pend">待查</span>' : r[2].split('／').map(x=>`<div>${srcLink(x)}</div>`).join('');
    const pk = pathKey(r[3]);
    const k = keyOf(t,r), on = !!CK[k];
    return `<tr class="${brk?'rolebreak':''}${on?' done':''}"><td class="ck"><input type="checkbox" data-ck="${esc(k)}" ${on?'checked':''} aria-label="勾選 ${esc(r[1])}"></td><td class="role">${esc(r[0])}</td><td class="name"><button data-person="${esc(r[1])}">${esc(r[1])}</button></td><td class="edu">${edu}</td><td><span class="chip p-${pk==='other'?'other':pk}">${esc(r[3])}</span></td><td class="note">${srcLink(r[4]||'')}</td></tr>`;
  }).join('');
  const fbtn = ['all','中醫系','後中','特考','other','pend'].map(k=>`<button data-filter="${k}" aria-pressed="${filter===k}">${k==='all'?'全部':pathLabel[k]}</button>`).join('');
  main.innerHTML = `<section class="termhead">
      <h2>${esc(t.h)}</h2>
      <div class="meta"><span class="chip ${statusCls(t.status)}">${esc(t.status)}</span><span>來源 ${srcLink(t.src)}</span>${t.pres?`<span>理事長 <b style="color:var(--ink)">${esc(t.pres)}</b></span>`:''}</div>
      <div class="note">${esc(t.note)}</div>
    </section>
    ${t.rows.length>3?pathBar(t.rows):''}
    <div class="checkbar">
      <span class="prog">已勾 <b>${done}</b> / ${total}</span>
      <span class="pbar"><span style="width:${total?done/total*100:0}%"></span></span>
      <span class="filters" aria-label="依勾選狀態篩選">${[['all','全部'],['done','已勾'],['todo','未勾']].map(([k,l])=>`<button data-ckf="${k}" aria-pressed="${ckfilter===k}">${l}</button>`).join('')}</span>
      <button class="act" data-bulk="all">全部勾選</button>
      <button class="act" data-copy>複製已勾名單</button>
      <button class="act ${armed?'warn':''}" data-bulk="clear">${armed?'再按一次確認清除':'清除本屆勾選'}</button>
      <span class="toast" id="toast" aria-live="polite"></span>
    </div>
    ${t.rows.length>3?`<div class="filters" aria-label="依取得途徑篩選">${fbtn}</div>`:''}
    <div class="tablewrap"><table><thead><tr><th class="ck" title="勾選">✓</th><th>職位</th><th>姓名</th><th>學歷</th><th>取得途徑</th><th>備註</th></tr></thead><tbody>${body||'<tr><td colspan="6" class="pend">此篩選下沒有人。</td></tr>'}</tbody></table></div>
    <p class="count">點姓名可看此人歷屆任職。勾選只存在這個瀏覽器，換電腦或清除瀏覽資料後會消失。</p>`;
}

function renderPres(){
  main.innerHTML = `<section class="termhead"><h2>歷任理事長</h2><div class="note">民國 34 年於重慶成立，38 年後會務中斷；64 年在台復會。81 年修正人民團體法後，改選者一律改稱第二屆。</div></section>
  <div class="tablewrap"><table class="pres-table"><thead><tr><th>屆次</th><th>改選</th><th>理事長</th><th>備註</th></tr></thead><tbody>
  ${D.pres.map(p=>`<tr><td>${esc(p[0])}</td><td style="font-variant-numeric:tabular-nums">${esc(p[1])}</td><td class="name">${p[2].split('→').map(n=>`<button data-person="${esc(n)}">${esc(n)}</button>`).join(' → ')}</td><td class="note">${esc(p[3])}</td></tr>`).join('')}
  </tbody></table></div>`;
}

function renderSources(){
  main.innerHTML = `<section class="termhead" id="src"><h2>資料來源</h2><div class="note">S 為名單與沿革來源，E 為個人學歷補查來源。原整理檔已有的學歷沿用，未逐筆附出處。</div></section>
  <div class="panel sources">${D.sources.map(s=>`<div><b style="color:var(--ink)">〔${s[0]}〕</b>${esc(s[1])}<br><a href="${esc(s[2])}" target="_blank" rel="noopener">${esc(s[2])}</a></div>`).join('')}</div>`;
}

function personPanel(name){
  const hits = [];
  terms.forEach(t=>t.rows.forEach(r=>{ if(r[1]===name) hits.push({t,r}); }));
  if(!hits.length) return '';
  const r0 = hits[0].r;
  return `<div class="panel" id="person"><button class="close" data-close>← 回到${current==='pres'?'歷任理事長':current==='sources'?'資料來源':terms[current].short}</button>
    <h3>${esc(name)}</h3>
    <div class="meta"><span class="chip p-${pathKey(r0[3])==='other'?'other':pathKey(r0[3])}">${esc(r0[3])}</span><span>出現於 ${hits.length} 屆</span></div>
    <div>${r0[2]==='待查'?'<span class="pend">學歷待查</span>':r0[2].split('／').map(x=>`<div>${srcLink(x)}</div>`).join('')}</div>
    ${r0[4]?`<div class="note">${srcLink(r0[4])}</div>`:''}
    <div class="timeline">${hits.map(h=>`<div class="tl"><button data-term="${h.t.i}">${esc(h.t.short)}</button><span>${esc(h.r[0])}${h.r[4]&&h.r[4]!==r0[4]?`<span class="count">　${esc(h.r[4])}</span>`:''}</span></div>`).join('')}</div>
  </div>`;
}

function show(view){
  current = view;
  if(view==='pres') renderPres(); else if(view==='sources') renderSources(); else renderTerm(view);
  renderNav();
  try{ localStorage.setItem('tm_view', String(view)); }catch(e){}
}

function search(q){
  q = q.trim();
  if(!q){ show(current); return; }
  const m = new Map();
  terms.forEach(t=>t.rows.forEach(r=>{ if(r[1].includes(q)) { if(!m.has(r[1])) m.set(r[1],[]); m.get(r[1]).push(t.short+' '+r[0]); } }));
  main.innerHTML = `<section class="termhead"><h2>「${esc(q)}」</h2><p class="count">找到 ${m.size} 人</p></section>
    <div class="panel results">${[...m].map(([n,ts])=>`<button class="res" data-person="${esc(n)}"><span class="n">${esc(n)}</span><span class="t">${esc(ts.join('、'))}</span></button>`).join('')||'<span class="pend">沒有符合的姓名。可試著只輸入姓或單一字。</span>'}</div>`;
}

document.addEventListener('click', e=>{
  const b = e.target.closest('button,[data-src]'); if(!b) return;
  if(b.dataset.src){ e.preventDefault(); show('sources'); return; }
  if(b.dataset.term!==undefined){ document.getElementById('q').value=''; filter='all'; ckfilter='all'; armed=false; show(+b.dataset.term); window.scrollTo({top:0}); }
  else if(b.dataset.view){ document.getElementById('q').value=''; show(b.dataset.view); }
  else if(b.dataset.filter){ filter=b.dataset.filter; renderTerm(current); }
  else if(b.dataset.person){ main.innerHTML = personPanel(b.dataset.person); window.scrollTo({top:0}); }
  else if(b.hasAttribute('data-close')){ show(current); }
});
document.addEventListener('change', e=>{
  const c = e.target.closest('input[data-ck]'); if(!c) return;
  if(c.checked) CK[c.dataset.ck]=1; else delete CK[c.dataset.ck];
  saveCK(); armed=false;
  const sy = window.scrollY; renderTerm(current); renderNav(); window.scrollTo({top:sy});
});
document.addEventListener('click', async e=>{
  const b = e.target.closest('button'); if(!b || typeof current!=='number') return;
  const t = terms[current];
  if(b.dataset.ckf){ ckfilter=b.dataset.ckf; armed=false; renderTerm(current); }
  else if(b.dataset.bulk==='all'){ t.rows.forEach(r=>CK[keyOf(t,r)]=1); saveCK(); armed=false; renderTerm(current); renderNav(); }
  else if(b.dataset.bulk==='clear'){ if(!armed){ armed=true; renderTerm(current); return; } t.rows.forEach(r=>delete CK[keyOf(t,r)]); saveCK(); armed=false; renderTerm(current); renderNav(); }
  else if(b.hasAttribute('data-copy')){
    const txt = t.rows.filter(r=>CK[keyOf(t,r)]).map(r=>r[0]+'\t'+r[1]+'\t'+r[2].replace(/／/g,'；')+'\t'+r[3]).join('\n');
    const toast = document.getElementById('toast');
    if(!txt){ toast.textContent='本屆還沒有勾選。'; return; }
    try{ await navigator.clipboard.writeText(t.h+'\n'+txt); toast.textContent='已複製，可貼到 Excel 或 Word。'; }
    catch(err){ toast.textContent='瀏覽器不允許自動複製，請改用「已勾」篩選後手動選取表格。'; }
  }
});
document.getElementById('q').addEventListener('input', e=>search(e.target.value));

let start = 0;
try{ const v = localStorage.getItem('tm_view'); if(v==='pres'||v==='sources') start=v; else if(v!==null && terms[+v]) start=+v; }catch(e){}
show(start);
</script>

</body>
</html>
